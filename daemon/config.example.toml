[server]
bind = "0.0.0.0"
port = 8090

[ha]
url = "http://pi5.local:8123"
token = "YOUR_HA_LONG_LIVED_TOKEN"

[sprinkler]
max_duration_secs = 1800   # 30 minutes — sécurité anti-flood
mutex = true               # une seule vanne ouverte à la fois
invert_logic = true        # active-low relay board (GPIO LOW = relay ON)

[[zones]]
id = "arrosage1"
name = "Arrosage Zone 1"
gpio = 5
kind = "sprinkler"

[[zones]]
id = "arrosage2"
name = "Arrosage Zone 2"
gpio = 6
kind = "sprinkler"

[[zones]]
id = "arrosage3"
name = "Arrosage Zone 3"
gpio = 13
kind = "sprinkler"

[[zones]]
id = "arrosage4"
name = "Arrosage Zone 4"
gpio = 19
kind = "sprinkler"
# max_duration_secs = 900  # override par zone si besoin

# Compteur d'eau Honeywell V200 (1 pulse = 1 litre)
# Le daemon est stateless : à chaque pulse, un event `waterpi_meter_pulse`
# est envoyé à HA, qui accumule lui-même la valeur.
[[meters]]
id = "compteur_eau"
name = "Compteur d'eau"
gpio = 17
unit = "L"
device_class = "water"
debounce_ms = 200
# increment_per_pulse = 1   # défaut, override si 1 pulse ≠ 1 unité

# Interrupteurs à bascule (entrées) — câblés entre GPIO et GND, pull-up interne.
# Fermé = ligne LOW = ON (inverser avec `inverted = true`).
# GPIO 16/20/21/26 = broches physiques 36/38/40/37, GND partagé broche 34 ou 39.
# NB: GPIO 20/21 servent aussi au PCM/I2S — libres sauf si HAT audio un jour.
# [[switches]]
# id = "inter1"
# name = "Interrupteur 1"
# gpio = 16
# debounce_ms = 50   # optionnel, défaut 50 (0 = pas de debounce kernel)
# inverted = false   # optionnel, défaut false
#
# [[switches]]
# id = "inter2"
# name = "Interrupteur 2"
# gpio = 20
#
# [[switches]]
# id = "inter3"
# name = "Interrupteur 3"
# gpio = 21
#
# [[switches]]
# id = "inter4"
# name = "Interrupteur 4"
# gpio = 26

# Écran OLED I2C 128x64 (broches 3/5 = GPIO2 SDA / GPIO3 SCL) :
# SSD1306 0.96" (défaut) ou SSD1309 2.42".
# Section absente = pas d'écran. Init impossible => warning, le daemon continue.
# [display]
# enabled = true
# driver = "ssd1306"                # "ssd1306" (défaut) ou "ssd1309" (2.42")
# i2c_bus = 1                       # défaut 1 (/dev/i2c-1)
# address = 0x3C                    # défaut 0x3C (certains modules : 0x3D)
# reset_gpio = 4                    # ssd1309 avec broche RST/RES -> GPIO libre (ex. 4, broche 7)
#                                   # module I2C 4 broches (auto-reset intégré) : omettre
# contrast = 255                    # 0-255, optionnel (255 = luminosité max)
# weather_entity = "weather.maison" # optionnel : météo HA au repos (sinon horloge)
# refresh_secs = 1                  # défaut 1
# weather_refresh_secs = 300        # défaut 300
